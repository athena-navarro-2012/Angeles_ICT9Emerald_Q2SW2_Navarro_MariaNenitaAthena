	<table class="table table-striped">

  <div class="contact" align="center">

  <h2>Contact Us</h2>

<form>
		<label for="fname"> Full Name: </label>
		<br>
		<input type="text" id="fname" name="fname" placeholder="Enter your full name">
		<br>
		<label for="email"> Email Address: </label>
		<br>
		<input type="text" id="email" name="email" placeholder="Enter your email">
		<br>
		<label for="subject"> Subject </label>
		<br>
		<input type="text" id="subject" name="subject" placeholder="Enter subject">
		<br>
		<label for="message">Share your message here </label>
		<br>
		<textarea id="message" name="message" rows="3" cols="23" placeholder="Type your message here:"></textarea>
	</form>
 </div>
